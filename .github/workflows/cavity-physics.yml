name: AboveBound offline cavity physics checks

on:
  push:
    paths:
      - "research/**"
      - ".github/workflows/cavity-physics.yml"
  pull_request:
    paths:
      - "research/**"
      - ".github/workflows/cavity-physics.yml"

permissions:
  contents: read

jobs:
  python-cavity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "research/requirements.txt"
      - name: Install numerical dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Check mass conservation, conduction and impermeable walls
        run: python -m unittest discover -s research/tests -v
      - name: Run autonomous offline geometry campaign
        run: python research/run_cavity_campaign.py --workers 2 --output cavity-results
      - name: Assert numerical evidence and data contract exist
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          r=json.loads(Path('cavity-results/report.json').read_text())
          assert r['evaluated']==8
          assert r['evidence']=='modeled_only_not_experimental'
          assert math.isfinite(r['relative_top_heat_flux_percent'])
          assert r['refinement']['gain_sign_reproduced']
          assert all(x['steady'] for x in r['ranked_candidates'])
          assert Path('cavity-results/winner_fields.npz').is_file()
          assert Path('cavity-results/winner_midplane.json').is_file()
          PY
