name: Local-first CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - name: Verify no API backend is required by static assets
        run: |
          test -f dist/index.html
          test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
          ! grep -R -E '(/api/house/optimize-site|/ws|aws-sdk)' dist/assets/*.js
