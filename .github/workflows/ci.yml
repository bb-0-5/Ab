name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate Docker Compose configuration
        run: TUNNEL_TOKEN=ci-placeholder docker compose config --quiet
      - run: npm ci
      - run: npm run test:all
