name: Local-first CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - name: Verify exact torus physics and 3D topology renderer
        run: node scripts/fluid-physics-smoke.mjs
      - name: Verify coupled 2.5D slice physics and inference
        run: node scripts/slice-engine-smoke.mjs
      - name: Validate V10 masks, pressure fields and solid impermeability
        run: node scripts/v10-membrane-smoke.mjs
      - name: Check CFD masks match V10MeshEngine
        run: npx tsx scripts/v10-membrane-parity-smoke.ts
      - name: Verify restored V0–V13 frontend and static bundle
        run: |
          test -f dist/index.html
          # Original V0–V13 remains intact and research labs add static routes.
          if grep -q '<title>404' dist/index.html; then
            test -f dist/_worker.js
            grep -q 'status:404' dist/_worker.js
          else
            test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
          fi
          grep -q "import App from './App.tsx'" src/main.tsx
          test -f src/simulations/v0_compression.ts
          test -f src/simulations/v7.ts
          test -f src/simulations/v13_material.ts
          test -f dist/membrane.html
          test -f dist/v10-membrane-masks.mjs
          test -f dist/membrane-worker.mjs
          test -f dist/slices.html
          test -f dist/torus-v3.html
          test -f dist/slice-worker.mjs


      - name: Verify primary experience route and original V0–V13 access
        run: node scripts/home-routing-smoke.mjs

      - name: Verify live V10 field streaming and adaptive screening
        run: node scripts/membrane-visibility-smoke.mjs
